[package]
name = "ourdao-dao"
description = "OurDAO — a member-owned lending DAO for Stellar Soroban"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
# Enables the budget scaling benchmark run by scripts/bench-cost.sh.
bench-budget = []

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"
