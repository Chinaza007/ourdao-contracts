[package]
name = "ourdao-dao"
description = "OurDAO — a member-owned lending DAO for Stellar Soroban"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lib]
# cdylib only: with an extra `rlib`, `cargo build` drops `-C lto` for this
# crate and the release wasm grows by ~40 KB (#357). Unit tests don't need it.
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"
